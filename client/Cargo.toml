[package]
name = "licensify-client"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
hkdf = "0.12"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
x509-cert = "0.2"
zeroize = "1"
