name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build server binaries
        working-directory: server
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/licensify-server-linux-amd64 ./cmd/licensify-server
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o dist/licensify-server-darwin-arm64 ./cmd/licensify-server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/licensify-server-windows-amd64.exe ./cmd/licensify-server

      - name: Build and push server image (GHCR)
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t ghcr.io/${{ github.repository_owner }}/licensify-server:${{ github.ref_name }} ./server
          docker push ghcr.io/${{ github.repository_owner }}/licensify-server:${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server/dist/licensify-server-*
