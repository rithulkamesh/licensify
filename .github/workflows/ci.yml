name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build + test
        run: |
          cargo build
          cargo test

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Go build + test (server)
        working-directory: server
        run: |
          go test ./...
          go build ./...

      - name: Go build (sdk/go)
        working-directory: sdk/go
        run: |
          go test ./... || true
          go build ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: TypeScript typecheck
        working-directory: sdk/typescript
        run: |
          npm ci
          npx tsc --noEmit
